<h1 pdk-typography="heading-xlarge">{{ 'MANUAL_CASE_DEFENDANT.PAGE_TITLE' | translate }}</h1>
<h2 pdk-typography="heading-medium">
  {{ 'MANUAL_CASE_DEFENDANT.DEFENDANT_NO' | translate }} {{ counter }}
</h2>

<pdk-grid container>
  <pdk-grid two-thirds *ngIf="editDefendant">
    <fieldset pdk-margin-top="3" pdk-fieldset>
      <legend pdk-legend="small" pdk-margin-bottom="3">
        {{ 'MANUAL_CASE_DEFENDANT.DEFENDANT_TYPE' | translate }}
      </legend>

      <pdk-radio-group
        name="type"
        [inline]="true"
        [(ngModel)]="defendantType"
        (click)="clearErrors()"
        data-role="other-type-input"
        pdk-margin-bottom="3"
      >
        <pdk-radio-button value="INDIVIDUAL">
          {{ 'APPLICANT_DETAILS.INDIVIDUAL' | translate }}
        </pdk-radio-button>

        <pdk-radio-button value="ORGANISATION">
          {{ 'APPLICANT_DETAILS.ORGANISATION' | translate }}
        </pdk-radio-button>
      </pdk-radio-group>
    </fieldset>

    <ng-container *ngIf="defendantType === 'INDIVIDUAL'">
      <individual-defendant-form
        [manualCaseDefendant]="editDefendant"
        [manualCaseType]="manualCaseType"
        [aliasesReset]="aliasesReset"
        [remandStatuses]="remandStatuses"
        [showAddButton]="iterateDefendant"
        [isPoliceProsecutor]="isPoliceProsecutor()"
        (onSubmit)="submitData($event)"
        (onError)="displayErrors($event)"
        (onBack)="back()"
      >
      </individual-defendant-form>
    </ng-container>

    <ng-container *ngIf="defendantType === 'ORGANISATION'">
      <organisation-defendant-form
        [aliasesReset]="aliasesReset"
        [isPoliceProsecutor]="isPoliceProsecutor()"
        [manualCaseDefendant]="editDefendant"
        [manualCaseType]="manualCaseType"
        [showAddButton]="iterateDefendant"
        (onSubmit)="submitData($event)"
        (onError)="displayErrors($event)"
        (onBack)="back()"
      >
      </organisation-defendant-form>
    </ng-container>
  </pdk-grid>
</pdk-grid>
