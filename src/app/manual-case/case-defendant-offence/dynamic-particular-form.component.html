<ng-container *ngIf="isEditMode && data">
  <form pdk-form novalidate (validSubmit)="submitData()" (errors)="onError.emit($event)">
    <div *ngFor="let section of data.sections; let i = index">
      <ng-container *ngIf="section.type === 'DROPDOWN'">
        <pdk-form-field
          label="{{ section.label }}"
          labelType="small"
          [errorMessages]="[
            {
              rule: 'required',
              message: 'MANUAL_CASE_OFFENCE.OFFENCE_DATE_TYPE_REQUIRED' | translate
            }
          ]"
        >
          <pdk-select
            [name]="'value_' + i"
            [(ngModel)]="section.value"
            [options]="offenceDateTypes"
            (change)="onOffenceDateTypeChange($event, i)"
            [required]="true"
            justified
          >
          </pdk-select>
        </pdk-form-field>
      </ng-container>

      <ng-container *ngIf="section.type === 'DATE'">
        <pdk-form-field
          label="{{
            (section.showValueTwoElement
              ? 'MANUAL_CASE_OFFENCE.START_DATE'
              : 'MANUAL_CASE_OFFENCE.DATE'
            ) | translate
          }}"
          labelType="small"
          [errorMessages]="[
            {
              rule: 'required',
              message: 'MANUAL_CASE_OFFENCE.DATE_REQUIRED' | translate
            },
            {
              rule: 'maxDate',
              message: !section.showValueTwoElement
                ? ('MANUAL_CASE_OFFENCE.BEFORE_ARREST_DATE_ERROR' | translate)
                : ('MANUAL_CASE_OFFENCE.AFTER_START_DATE_ERROR' | translate)
            }
          ]"
        >
          <pdk-date-input
            name="date_{{ i }}"
            [(ngModel)]="section.value"
            pastDate
            required
            [maxDate]="section.showValueTwoElement ? section.valueTwo : arrestDateValue"
            picker
          >
          </pdk-date-input>
        </pdk-form-field>

        <ng-container *ngIf="section.showValueTwoElement">
          <pdk-form-field
            label="{{ 'MANUAL_CASE_OFFENCE.END_DATE' | translate }}"
            labelType="small"
            [errorMessages]="[
              {
                rule: 'maxDate',
                message: 'MANUAL_CASE_OFFENCE.BEFORE_ARREST_DATE_ERROR' | translate
              },
              {
                rule: 'required',
                message: 'MANUAL_CASE_OFFENCE.DATE_REQUIRED' | translate
              },
              {
                rule: 'minDate',
                message: 'MANUAL_CASE_OFFENCE.AFTER_START_DATE_ERROR' | translate
              }
            ]"
          >
            <pdk-date-input
              name="end_date_{{ i }}"
              [(ngModel)]="section.valueTwo"
              pastDate
              [minDate]="section.value"
              [maxDate]="arrestDateValue"
              required
              picker
            >
            </pdk-date-input>
          </pdk-form-field>
        </ng-container>
      </ng-container>

      <ng-container *ngIf="section.type === 'LABEL'">
        <div class="dynamic-label">{{ section.label }}</div>
      </ng-container>

      <ng-container *ngIf="section.type === 'TEXT'">
        <pdk-form-field
          label="{{ section.label }}"
          labelType="small"
          [errorMessages]="[
            {
              rule: 'required',
              message: section.label
            }
          ]"
        >
          <input
            pdk-text-input
            pdk-input
            type="text"
            name="value_{{ i }}"
            [(ngModel)]="section.value"
            required
            [attr.data-role]="section.label"
          />
        </pdk-form-field>
      </ng-container>

      <ng-container *ngIf="section.type === 'LIST'">
        <pdk-form-field
          label="{{ 'MANUAL_CASE_OFFENCE.SELECT_AN_OPTION' | translate }}"
          labelType="small"
          [errorMessages]="[
            {
              rule: 'required',
              message: 'MANUAL_CASE_OFFENCE.SELECT_AN_OPTION' | translate
            }
          ]"
        >
          <pdk-radio-group
            name="value_{{ i }}"
            [ngModel]="section.value"
            (ngModelChange)="section.value = $event; optionSelect(section.list)"
            required
            attr.data-role="value_{{ i }}"
          >
            <div *ngFor="let radio of section.list; let r = index">
              <pdk-radio-button pdk-margin-bottom="2" [value]="radio.value">{{
                radio.label
              }}</pdk-radio-button>

              <fieldset [disabled]="radio.value !== section.value" *ngIf="radio.children">
                <div class="radio-container">
                  <ng-container *ngFor="let child of radio.children; let z = index">
                    <ng-container *ngIf="child.type === 'TEXT'">
                      <pdk-form-field
                        label="{{ child.label }}"
                        labelType="small"
                        [errorMessages]="[
                          {
                            rule: 'required',
                            message: child.label
                          }
                        ]"
                      >
                        <input
                          pdk-text-input
                          pdk-input
                          type="text"
                          name="value_{{ i }}_{{ r }}_{{ z }}"
                          [(ngModel)]="child.value"
                          [required]="radio.value === section.value"
                        />
                      </pdk-form-field>
                    </ng-container>

                    <ng-container *ngIf="child.type === 'LABEL'">
                      <div class="dynamic-label">{{ child.label }}</div>
                    </ng-container>
                  </ng-container>
                </div>
              </fieldset>
            </div>
          </pdk-radio-group>
        </pdk-form-field>
      </ng-container>
    </div>

    <div>
      <button
        pdk-button="secondary"
        type="submit"
        pdk-margin-top="3"
        pdk-margin-bottom="3"
        data-role="apply"
      >
        Apply Details
      </button>
    </div>
  </form>
</ng-container>

<ng-container *ngIf="!isEditMode">
  <div>
    <pdk-form-field label="{{ 'CASE_DETAILS.OFFENCE.PARTICULARS' | translate }}" labelType="small">
      <textarea
        pdk-resize
        minRows="5"
        maxRows="10"
        pdk-text-input
        pdk-input
        name="offenceWording"
        [ngModel]="offenceWording"
        [readonly]="true"
      >
      </textarea>
    </pdk-form-field>

    <button
      pdk-button="secondary"
      pdk-margin-top="3"
      pdk-margin-bottom="3"
      data-role="amend"
      (click)="isEditMode = true"
    >
      Amend Details
    </button>
  </div>
</ng-container>
