<label pdk-label>Enter case reference number or defendant’s last name</label>
<pdk-grid container>
  <form pdk-form #form="ngForm" (submit)="search()">
    <pdk-grid one-third>
      <pdk-form-field>
        <pdk-searchbar [(ngModel)]="searchKeyword" name="searchInput"> </pdk-searchbar>
      </pdk-form-field>
    </pdk-grid>
  </form>
</pdk-grid>
